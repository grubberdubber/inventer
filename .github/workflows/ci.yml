name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Core tests
        run: python -m pytest -q tests/test_core.py

  ui-smoke:
    name: UI smoke (Xvfb)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Tk and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-tk python3-venv xvfb

      - name: Set up virtual environment
        run: |
          python3 -m venv /tmp/inventer-venv
          /tmp/inventer-venv/bin/python -m pip install --upgrade pip
          /tmp/inventer-venv/bin/python -m pip install -r requirements-dev.txt

      - name: Run Tkinter smoke test
        run: xvfb-run -a /tmp/inventer-venv/bin/python -m pytest -q tests/test_ui.py
