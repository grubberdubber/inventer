<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-labelledby="title desc">
  <title id="title">INVENTER — Supermarket Inventory Core</title>
  <desc id="desc">Banner del sistema de inventario INVENTER construido con Python, Tkinter y SQLite.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080D12"/>
      <stop offset="0.55" stop-color="#0B131B"/>
      <stop offset="1" stop-color="#0E161F"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#37E5A5"/>
      <stop offset="1" stop-color="#4CC9F0"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#37E5A5" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#37E5A5"/>
      <stop offset="0.75" stop-color="#4CC9F0"/>
      <stop offset="1" stop-color="#4CC9F0" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#223341" stroke-width="1" stroke-opacity="0.28"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="300" fill="url(#bg)"/>
  <rect width="1280" height="300" fill="url(#grid)"/>
  <circle cx="1130" cy="24" r="210" fill="#37E5A5" opacity="0.035"/>
  <circle cx="1240" cy="270" r="170" fill="#4CC9F0" opacity="0.04"/>

  <g transform="translate(70 104)">
    <polygon points="46,0 92,26 92,78 46,104 0,78 0,26" fill="#37E5A5" filter="url(#glow)" opacity="0.22"/>
    <polygon points="46,2 90,27 90,77 46,102 2,77 2,27" fill="#37E5A5"/>
    <polygon points="46,14 78,32 78,72 46,90 14,72 14,32" fill="#0B131B"/>
    <text x="46" y="67" text-anchor="middle" font-family="Inter, Segoe UI, DejaVu Sans, sans-serif" font-size="42" font-weight="800" fill="#37E5A5">I</text>
  </g>

  <text x="200" y="140" font-family="Inter, Segoe UI, DejaVu Sans, sans-serif" font-size="68" font-weight="800" letter-spacing="6" fill="#E9F2F9">INVENTER</text>
  <text x="203" y="176" font-family="Inter, Segoe UI, DejaVu Sans, sans-serif" font-size="15" font-weight="700" letter-spacing="5.5" fill="#9CB0C0">SUPERMARKET INVENTORY CORE</text>
  <text x="203" y="211" font-family="Inter, Segoe UI, DejaVu Sans, sans-serif" font-size="15" fill="#637A8C">Control de stock en tiempo real · Python · Tkinter · SQLite WAL</text>

  <g font-family="Inter, Segoe UI, DejaVu Sans, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">
    <g transform="translate(203 235)">
      <rect width="74" height="26" rx="6" fill="#10382D" stroke="#37E5A5" stroke-opacity="0.35"/>
      <text x="37" y="17" text-anchor="middle" fill="#37E5A5">STOCK</text>
    </g>
    <g transform="translate(285 235)">
      <rect width="58" height="26" rx="6" fill="#10303D" stroke="#4CC9F0" stroke-opacity="0.35"/>
      <text x="29" y="17" text-anchor="middle" fill="#4CC9F0">POS</text>
    </g>
    <g transform="translate(351 235)">
      <rect width="104" height="26" rx="6" fill="#1A2936" stroke="#223341"/>
      <text x="52" y="17" text-anchor="middle" fill="#9CB0C0">AUDITORÍA</text>
    </g>
    <g transform="translate(463 235)">
      <rect width="82" height="26" rx="6" fill="#3A2D12" stroke="#F2B84B" stroke-opacity="0.4"/>
      <text x="41" y="17" text-anchor="middle" fill="#F2B84B">ALERTAS</text>
    </g>
    <g transform="translate(553 235)">
      <rect width="112" height="26" rx="6" fill="#1A2936" stroke="#223341"/>
      <text x="56" y="17" text-anchor="middle" fill="#9CB0C0">SQLITE WAL</text>
    </g>
  </g>

  <g transform="translate(900 82)">
    <rect width="310" height="136" rx="14" fill="#0E161F" stroke="#223341"/>
    <text x="20" y="28" font-family="Inter, Segoe UI, DejaVu Sans, sans-serif" font-size="10" font-weight="700" letter-spacing="1.8" fill="#637A8C">TELEMETRÍA OPERATIVA</text>
    <g font-family="Inter, Segoe UI, DejaVu Sans, sans-serif">
      <text x="20" y="72" font-size="34" font-weight="800" fill="#E9F2F9">28</text>
      <text x="20" y="92" font-size="10" fill="#637A8C">SKU ACTIVOS</text>
      <text x="112" y="72" font-size="34" font-weight="800" fill="#37E5A5">909</text>
      <text x="112" y="92" font-size="10" fill="#637A8C">UNIDADES</text>
      <text x="224" y="72" font-size="34" font-weight="800" fill="#F04438">8</text>
      <text x="224" y="92" font-size="10" fill="#637A8C">ALERTAS</text>
    </g>
    <rect x="20" y="108" width="270" height="6" rx="3" fill="#1A2936"/>
    <rect x="20" y="108" width="198" height="6" rx="3" fill="url(#accent)"/>
    <text x="20" y="128" font-family="Inter, Segoe UI, DejaVu Sans, sans-serif" font-size="9" fill="#637A8C">COBERTURA DE CAPACIDAD · 41%</text>
  </g>

  <g transform="translate(900 232)">
    <circle cx="4" cy="4" r="4" fill="#37E5A5"/>
    <text x="16" y="8" font-family="Inter, Segoe UI, DejaVu Sans, sans-serif" font-size="11" fill="#9CB0C0">SISTEMA EN LÍNEA · 4 WORKERS ASÍNCRONOS</text>
  </g>

  <rect x="0" y="297" width="1280" height="3" fill="url(#line)"/>
</svg>
