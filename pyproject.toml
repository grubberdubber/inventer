[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inventer"
version = "1.0.0"
description = "Núcleo de inventario para supermercados con UI Tkinter, SQLite WAL y operaciones atómicas."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "grubberdubber" },
]
keywords = [
  "inventory",
  "supermarket",
  "tkinter",
  "sqlite",
  "desktop",
  "python",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: X11 Applications",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Point-Of-Sale",
  "Topic :: Database",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/grubberdubber/inventer"
Repository = "https://github.com/grubberdubber/inventer"
Issues = "https://github.com/grubberdubber/inventer/issues"
Changelog = "https://github.com/grubberdubber/inventer/blob/main/CHANGELOG.md"
GitLab = "https://gitlab.com/grubberdubber/inventer"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["core*", "ui*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
  "error::DeprecationWarning",
]

[tool.coverage.run]
source = ["core", "ui"]
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["var", ".venv", "venv"]

[tool.ruff.lint]
select = [
  "E4",
  "E7",
  "E9",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
]
ignore = [
  "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["core", "ui"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
